# 통합 테스트 프로파일
#
# 시드 데이터(9MB)를 로드하지 않는다. Flyway location 이 db/migration 뿐이라
# 스키마 18개 테이블만 올라간다. 테스트는 필요한 픽스처를 직접 만든다.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # 테스트 전용 키. 32바이트 이상이어야 기동한다.
    secret-key: test-secret-key-for-integration-tests-only-32bytes+
    access-token-validity: PT30M
    refresh-token-validity: P14D
    issuer: sakila-ddd-template-test

logging:
  level:
    root: WARN
    com.example.sakila: INFO
    org.testcontainers: INFO
