# Pinpoint 에이전트 부착 — override 파일
#
# 이 파일은 백엔드를 띄우지 않는다. 기존 app 서비스에 에이전트만 얹는다.
# 백엔드는 pinpoint/docker-compose.yml 로 따로 띄운다(여러 앱이 공유하는 인프라).
#
#   # 최초 1회
#   docker network create pinpoint-net
#   docker compose -f pinpoint/docker-compose.yml up -d
#
#   # 앱 — Pinpoint 없이 (기존과 완전히 동일)
#   docker compose -f docker-compose-prod.yml --profile app up -d
#
#   # 앱 — Pinpoint 에이전트 부착
#   docker compose -f docker-compose-prod.yml -f docker-compose-pinpoint.yml --profile app up -d
#
# 왜 override 파일인가:
#   같은 파일 안에서 profiles: 로는 "서비스 추가"만 되고 "기존 서비스 수정"이 안 된다.
#   에이전트 부착은 기존 app 서비스에 환경변수·볼륨·네트워크를 더하는 일이므로
#   override 가 맞는 도구다.

services:
  app:
    build:
      args:
        # 에이전트를 이미지에 포함시킨다. 기본은 false 라 평소엔 흔적이 없다.
        PINPOINT_ENABLED: "true"
        PINPOINT_VERSION: "${PINPOINT_VERSION:-3.1.0}"
    environment:
      # ENTRYPOINT 가 exec 배열이라 환경변수가 확장되지 않는다.
      # JAVA_TOOL_OPTIONS 는 JVM 이 직접 읽으므로 이 제약을 우회한다.
      #
      # -javaagent 는 버전 없는 pinpoint-bootstrap.jar 를 가리킨다.
      # 버전이 박힌 파일과 바이트 단위로 동일하므로, 버전을 올려도 이 줄은 그대로다.
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/pinpoint-agent/pinpoint-bootstrap.jar
        -Dpinpoint.config=/pinpoint-agent/pinpoint-root.config
        -Dpinpoint.agentId=${PINPOINT_AGENT_ID:-sakila-01}
        -Dpinpoint.applicationName=${PINPOINT_APPLICATION_NAME:-sakila-ddd-template}
        -Dprofiler.transport.grpc.collector.ip=${PINPOINT_COLLECTOR_HOST:-pinpoint-collector}
        -Dprofiler.sampling.counting.sampling-rate=${PINPOINT_SAMPLING_RATE:-1}

    volumes:
      # Dockerfile 이 이미지 안에 넣어둔 에이전트를 쓴다. 별도 마운트가 필요 없다.
      # (여기서는 네트워크만 추가하면 되므로 volumes 는 비워둔다)
      - type: volume
        source: app_log
        target: /app/logs

    networks:
      # default: 앱 <-> MySQL (기존 compose 의 네트워크)
      - default
      # pinpoint-net: 앱 <-> collector (백엔드 스택이 만든 external 네트워크)
      - pinpoint-net

networks:
  pinpoint-net:
    external: true
    name: pinpoint-net
